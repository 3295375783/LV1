    <script>
        // ==================== Game Classes ====================

        // 资源名称中文映射
        const RESOURCE_NAMES = {
            gold: '金币',
            food: '粮食',
            wood: '木材',
            iron: '铁矿',
            luxury: '奢侈品',
            happiness: '幸福度'
        };

        // 建筑效果名称中文映射
        const EFFECT_NAMES = {
            researchSpeed: '研究速度',
            tradeBonus: '贸易加成',
            recruitCost: '征兵费用'
        };

        const TRADE_GOODS = {
            spices: { name: '香料', icon: '🌶️', basePrice: 30, volatility: 0.3 },
            silk: { name: '丝绸', icon: '🧣', basePrice: 50, volatility: 0.2 },
            horses: { name: '马匹', icon: '🐴', basePrice: 40, volatility: 0.25 },
            jewelry: { name: '珠宝', icon: '💍', basePrice: 80, volatility: 0.15 },
            wine: { name: '葡萄酒', icon: '🍷', basePrice: 35, volatility: 0.2 },
            amber: { name: '琥珀', icon: '💎', basePrice: 60, volatility: 0.25 }
        };

        const BUILDINGS = {
            farm: {
                name: '农场',
                icon: '🌾',
                cost: { wood: 80, gold: 50 },
                maintenance: { gold: 5 },
                output: { food: 15 },
                upgradeCost: { wood: 150, gold: 100, iron: 50 },
                maxLevel: 3
            },
            mine: {
                name: '矿场',
                icon: '⛏️',
                cost: { wood: 100, gold: 80 },
                maintenance: { gold: 8 },
                output: { iron: 8, luxury: 2 },
                upgradeCost: { wood: 200, gold: 150, iron: 100 },
                maxLevel: 3
            },
            lumbermill: {
                name: '伐木场',
                icon: '🪓',
                cost: { gold: 60, iron: 30 },
                maintenance: { gold: 4 },
                output: { wood: 12 },
                upgradeCost: { gold: 120, iron: 80 },
                maxLevel: 3
            },
            academy: {
                name: '学院',
                icon: '📚',
                cost: { wood: 150, gold: 200, iron: 50 },
                maintenance: { gold: 15 },
                effect: 'researchSpeed',
                effectValue: 0.2,
                upgradeCost: { wood: 300, gold: 400, iron: 100, luxury: 20 },
                maxLevel: 3
            },
            market: {
                name: '市场',
                icon: '🏪',
                cost: { wood: 120, gold: 150, iron: 30 },
                maintenance: { gold: 10 },
                effect: 'tradeBonus',
                effectValue: 0.15,
                upgradeCost: { wood: 250, gold: 300, iron: 60, luxury: 10 },
                maxLevel: 3
            },
            barracks: {
                name: '兵营',
                icon: '🛡️',
                cost: { wood: 100, gold: 120, iron: 80 },
                maintenance: { gold: 12, food: 10 },
                effect: 'recruitCost',
                effectValue: -0.2,
                upgradeCost: { wood: 200, gold: 250, iron: 150 },
                maxLevel: 3
            },
            temple: {
                name: '神庙',
                icon: '⛪',
                cost: { wood: 200, gold: 300, luxury: 30 },
                maintenance: { gold: 20 },
                output: { happiness: 3 },
                upgradeCost: { wood: 400, gold: 600, luxury: 60, iron: 100 },
                maxLevel: 3
            }
        };

        class ResourceManager {
            constructor() {
                this.resources = {
                    gold: 1000,
                    food: 500,
                    wood: 300,
                    iron: 200,
                    luxury: 50,
                    population: 100,
                    military: 50,
                    happiness: 70
                };
                this.changes = {
                    gold: 50,
                    food: 20,
                    wood: 10,
                    iron: 5,
                    luxury: 2,
                    population: 5,
                    military: -2,
                    happiness: 1
                };
            }

            get(resource) {
                return this.resources[resource];
            }

            add(resource, amount) {
                this.resources[resource] += amount;
                if (resource === 'happiness') {
                    this.resources[resource] = Math.max(0, Math.min(100, this.resources[resource]));
                }
                this.updateDisplay();
            }

            canAfford(costs) {
                for (let [resource, amount] of Object.entries(costs)) {
                    if (this.resources[resource] < amount) return false;
                }
                return true;
            }

            pay(costs) {
                if (!this.canAfford(costs)) return false;
                for (let [resource, amount] of Object.entries(costs)) {
                    this.resources[resource] -= amount;
                }
                this.updateDisplay();
                return true;
            }

            updateChanges() {
                const econBonus = this.techTree ? this.techTree.getBonus('economy') : 1;
                const agriBonus = this.techTree ? this.techTree.getBonus('agriculture') : 1;
                const indBonus = this.techTree ? this.techTree.getBonus('industry') : 1;
                const happyBonus = this.resources.happiness >= 70 ? 1.1 : (this.resources.happiness <= 30 ? 0.9 : 1);

                this.changes.gold = Math.floor((this.resources.population * 0.3 + this.resources.luxury * 1.5) * econBonus * happyBonus);
                this.changes.food = Math.floor((this.resources.population * 0.3 - this.resources.military * 0.2) * agriBonus * happyBonus);
                this.changes.wood = Math.floor((10 + Math.random() * 5) * indBonus * happyBonus);
                this.changes.iron = Math.floor((5 + Math.random() * 3) * indBonus * happyBonus);
                this.changes.luxury = 2 + Math.floor(Math.random() * 2);
                this.changes.population = Math.floor(this.resources.food / 10);
                if (this.resources.happiness <= 10) this.changes.population -= 5;
                this.changes.military = -Math.floor(this.resources.military * 0.02);
                this.changes.happiness = this.resources.food > this.resources.population * 2 ? 1 : -2;

                // Apply building outputs and maintenance
                if (typeof game !== 'undefined' && game.buildingSystem) {
                    const buildingOutput = game.buildingSystem.getOutput();
                    const buildingMaintenance = game.buildingSystem.getMaintenanceCost();

                    for (let [res, amt] of Object.entries(buildingOutput)) {
                        this.changes[res] = (this.changes[res] || 0) + amt;
                    }
                    for (let [res, amt] of Object.entries(buildingMaintenance)) {
                        this.changes[res] = (this.changes[res] || 0) - amt;
                    }
                }
            }

            applyTurnChanges() {
                this.updateChanges();
                for (let [resource, change] of Object.entries(this.changes)) {
                    this.resources[resource] += change;
                }
                // Clamp values
                this.resources.happiness = Math.max(0, Math.min(100, this.resources.happiness));
                this.resources.food = Math.max(0, this.resources.food);
                this.updateDisplay();
            }

            updateDisplay() {
                for (let resource of Object.keys(this.resources)) {
                    const el = document.getElementById(`res-${resource}`);
                    const changeEl = document.getElementById(`change-${resource}`);
                    if (el) {
                        el.textContent = resource === 'happiness' ? 
                            `${this.resources[resource]}%` : this.resources[resource];
                    }
                    if (changeEl) {
                        const change = this.changes[resource];
                        changeEl.textContent = change >= 0 ? `+${change}` : `${change}`;
                        changeEl.className = `resource-change ${change < 0 ? 'negative' : ''}`;
                    }
                }
            }
        }

        class TradeSystem {
            constructor() {
                this.goods = {};
                this.tradeRoutes = [];
                this.marketTrend = 1;
                this.initGoods();
            }

            initGoods() {
                for (let [key, good] of Object.entries(TRADE_GOODS)) {
                    this.goods[key] = {
                        ...good,
                        currentPrice: good.basePrice,
                        stock: Math.floor(Math.random() * 50) + 20,
                        demand: Math.floor(Math.random() * 10) + 5,
                        trend: 0
                    };
                }
            }

            updatePrices() {
                this.marketTrend += (Math.random() - 0.5) * 0.1;
                this.marketTrend = Math.max(0.5, Math.min(1.5, this.marketTrend));

                for (let good of Object.values(this.goods)) {
                    const change = (Math.random() - 0.5) * good.volatility * good.basePrice;
                    good.trend = change > 0 ? 1 : -1;
                    good.currentPrice = Math.max(10, Math.floor(good.basePrice * this.marketTrend + change));
                }
            }

            getPrice(goodKey) {
                return this.goods[goodKey]?.currentPrice || 0;
            }

            buy(goodKey, quantity) {
                const good = this.goods[goodKey];
                if (!good || good.stock < quantity) return null;
                const cost = good.currentPrice * quantity;
                good.stock -= quantity;
                good.demand += quantity;
                return { cost, good: goodKey, quantity };
            }

            sell(goodKey, quantity) {
                const good = this.goods[goodKey];
                if (!good) return null;
                const revenue = Math.floor(good.currentPrice * quantity * 0.9);
                good.stock += quantity;
                good.demand = Math.max(1, good.demand - quantity);
                return { revenue, good: goodKey, quantity };
            }

            addTradeRoute(from, to, good, quantity) {
                this.tradeRoutes.push({
                    from, to, good, quantity,
                    established: Date.now(),
                    revenue: 0
                });
            }
        }

        class BuildingSystem {
            constructor() {
                this.buildings = [];
                this.effects = {
                    researchSpeed: 1,
                    tradeBonus: 1,
                    recruitCost: 1
                };
            }

            addBuilding(type, location = null) {
                const template = BUILDINGS[type];
                if (!template) return false;

                const building = {
                    type,
                    level: 1,
                    location,
                    established: Date.now(),
                    ...template
                };

                this.buildings.push(building);
                this.updateEffects();
                return building;
            }

            upgradeBuilding(index) {
                const building = this.buildings[index];
                if (!building || building.level >= building.maxLevel) return false;

                building.level++;
                // Increase output/effect based on level
                if (building.output) {
                    for (let key of Object.keys(building.output)) {
                        building.output[key] = Math.floor(building.output[key] * 1.5);
                    }
                }
                if (building.effectValue) {
                    building.effectValue *= 1.3;
                }
                this.updateEffects();
                return true;
            }

            updateEffects() {
                this.effects = {
                    researchSpeed: 1,
                    tradeBonus: 1,
                    recruitCost: 1
                };

                for (let building of this.buildings) {
                    if (building.effect) {
                        this.effects[building.effect] += building.effectValue * building.level;
                    }
                }
            }

            getMaintenanceCost() {
                const total = { gold: 0, food: 0 };
                for (let building of this.buildings) {
                    if (building.maintenance) {
                        for (let [res, amt] of Object.entries(building.maintenance)) {
                            total[res] = (total[res] || 0) + amt;
                        }
                    }
                }
                return total;
            }

            getOutput() {
                const total = {};
                for (let building of this.buildings) {
                    if (building.output) {
                        for (let [res, amt] of Object.entries(building.output)) {
                            total[res] = (total[res] || 0) + amt;
                        }
                    }
                }
                return total;
            }
        }

        class TechTree {
            constructor() {
                this.branches = {
                    military: {
                        name: '军事',
                        color: '#c73e3e',
                        techs: [
                            { id: 'm1', name: '铁器锻造', cost: { gold: 200, iron: 100 }, researched: false, desc: '提升军队攻击力' },
                            { id: 'm2', name: '战术训练', cost: { gold: 300, food: 200 }, researched: false, desc: '提升军队防御力' },
                            { id: 'm3', name: '攻城器械', cost: { gold: 500, wood: 300, iron: 150 }, researched: false, desc: '解锁攻城能力' },
                            { id: 'm4', name: '精锐军团', cost: { gold: 800, iron: 400, luxury: 50 }, researched: false, desc: '大幅提升军事实力' }
                        ]
                    },
                    economic: {
                        name: '经济',
                        color: '#d4af37',
                        techs: [
                            { id: 'e1', name: '货币铸造', cost: { gold: 150, iron: 50 }, researched: false, desc: '提升金币收入' },
                            { id: 'e2', name: '贸易路线', cost: { gold: 250, wood: 100 }, researched: false, desc: '解锁贸易功能' },
                            { id: 'e3', name: '银行业', cost: { gold: 400, luxury: 30 }, researched: false, desc: '金币收入翻倍' },
                            { id: 'e4', name: '商业帝国', cost: { gold: 600, luxury: 100 }, researched: false, desc: '大幅提升经济实力' }
                        ]
                    },
                    agriculture: {
                        name: '农业',
                        color: '#4a9b4a',
                        techs: [
                            { id: 'a1', name: '灌溉技术', cost: { wood: 150, gold: 100 }, researched: false, desc: '提升粮食产量' },
                            { id: 'a2', name: '轮作制度', cost: { food: 200, gold: 150 }, researched: false, desc: '稳定粮食收入' },
                            { id: 'a3', name: '肥料使用', cost: { iron: 100, gold: 200 }, researched: false, desc: '大幅提升粮食产量' },
                            { id: 'a4', name: '农业革命', cost: { gold: 500, wood: 300 }, researched: false, desc: '粮食产量翻倍' }
                        ]
                    },
                    industrial: {
                        name: '工业',
                        color: '#4a7cb8',
                        techs: [
                            { id: 'i1', name: '采矿技术', cost: { wood: 100, gold: 100 }, researched: false, desc: '提升铁矿产量' },
                            { id: 'i2', name: '木工工艺', cost: { iron: 50, gold: 100 }, researched: false, desc: '提升木材产量' },
                            { id: 'i3', name: '机械装置', cost: { iron: 200, wood: 150, gold: 300 }, researched: false, desc: '资源产量提升' },
                            { id: 'i4', name: '工业革命', cost: { iron: 400, gold: 600, luxury: 80 }, researched: false, desc: '所有资源产量大幅提升' }
                        ]
                    }
                };
            }

            isAvailable(techId) {
                for (let branch of Object.values(this.branches)) {
                    const index = branch.techs.findIndex(t => t.id === techId);
                    if (index !== -1) {
                        if (index === 0) return true;
                        return branch.techs[index - 1].researched;
                    }
                }
                return false;
            }

            research(techId) {
                for (let branch of Object.values(this.branches)) {
                    const tech = branch.techs.find(t => t.id === techId);
                    if (tech && !tech.researched && this.isAvailable(techId)) {
                        tech.researched = true;
                        return tech;
                    }
                }
                return null;
            }

            getBonus(type) {
                let bonus = 1;
                const branch = this.branches[type];
                if (branch) {
                    const researched = branch.techs.filter(t => t.researched).length;
                    bonus += researched * 0.25;
                }
                return bonus;
            }

            render() {
                const container = document.getElementById('techTree');
                container.innerHTML = '';

                for (let [key, branch] of Object.entries(this.branches)) {
                    const branchEl = document.createElement('div');
                    branchEl.className = 'tech-branch';
                    
                    const title = document.createElement('div');
                    title.className = `branch-title ${key}`;
                    title.textContent = branch.name;
                    branchEl.appendChild(title);

                    branch.techs.forEach((tech, index) => {
                        const techEl = document.createElement('div');
                        techEl.className = 'tech-node';
                        
                        if (tech.researched) {
                            techEl.classList.add('researched');
                        } else if (!this.isAvailable(tech.id)) {
                            techEl.classList.add('locked');
                        } else {
                            techEl.classList.add('available');
                        }

                        techEl.innerHTML = `
                            <div class="tech-name">${tech.name}</div>
                            <div class="tech-cost">${Object.entries(tech.cost).map(([k, v]) => `${RESOURCE_NAMES[k] || k}: ${v}`).join(', ')}</div>
                        `;

                        if (!tech.researched && this.isAvailable(tech.id)) {
                            techEl.onclick = () => game.researchTech(tech.id);
                        }

                        branchEl.appendChild(techEl);
                    });

                    container.appendChild(branchEl);
                }
            }
        }

        class AIPlayer {
            constructor(id, name, type, color) {
                this.id = id;
                this.name = name;
                this.type = type;
                this.color = color;
                this.resources = {
                    gold: 800,
                    food: 400,
                    wood: 250,
                    iron: 150,
                    luxury: 30,
                    population: 80,
                    military: 40,
                    happiness: 60
                };
                this.territory = [];
                this.relations = 50; // 0-100, 50 is neutral
                this.alliance = false;
            }

            takeTurn() {
                switch(this.type) {
                    case 'expansion':
                        this.expansionStrategy();
                        break;
                    case 'trade':
                        this.tradeStrategy();
                        break;
                    case 'tech':
                        this.techStrategy();
                        break;
                    case 'defense':
                        this.defenseStrategy();
                        break;
                    case 'diplomacy':
                        this.diplomacyStrategy();
                        break;
                }
            }

            expansionStrategy() {
                this.resources.military += 8;
                this.resources.gold += 20;
                this.clampResources();
                if (this.relations < 50 && Math.random() < 0.3 && this.resources.military > game.resources.get('military') * 0.8) {
                    this.attackPlayer();
                }
            }

            tradeStrategy() {
                this.resources.gold += 40;
                this.resources.luxury += 3;
                this.clampResources();
                if (Math.random() < 0.4) {
                    game.logEvent(`${this.name} 提出贸易请求`, 'diplomacy');
                }
            }

            techStrategy() {
                this.resources.gold += 10;
                this.clampResources();
                if (Math.random() < 0.3) {
                    game.logEvent(`${this.name} 研究了新科技`, 'tech');
                }
            }

            defenseStrategy() {
                this.resources.military += 8;
                this.resources.food += 10;
                this.resources.gold += 15;
                this.clampResources();
            }

            diplomacyStrategy() {
                this.resources.gold += 25;
                this.relations = Math.min(100, this.relations + 3);
                this.clampResources();
                if (Math.random() < 0.2 && this.relations > 70) {
                    this.alliance = true;
                    game.logEvent(`${this.name} 希望与我们结盟`, 'diplomacy');
                }
            }

            attackPlayer() {
                game.initiateBattle(this);
            }

            getPower() {
                const techCount = this.techs ? this.techs.length : 0;
                return (this.resources.military * 1.2 + this.resources.population / 3) * (1 + techCount * 0.1);
            }

            clampResources() {
                for (let key of Object.keys(this.resources)) {
                    this.resources[key] = Math.max(0, this.resources[key]);
                }
            }
        }

        class QuestSystem {
            constructor() {
                this.quests = [
                    {
                        id: 'q1',
                        title: '资源积累',
                        description: '积累3000金币',
                        target: { resource: 'gold', amount: 3000 },
                        reward: { gold: 200, luxury: 10 },
                        completed: false,
                        progress: 0
                    },
                    {
                        id: 'q2',
                        title: '军事扩张',
                        description: '建立100人的军队',
                        target: { resource: 'military', amount: 100 },
                        reward: { iron: 100, wood: 100 },
                        completed: false,
                        progress: 0
                    },
                    {
                        id: 'q3',
                        title: '科技研究',
                        description: '研究3项科技',
                        target: { type: 'tech', amount: 3 },
                        reward: { gold: 300 },
                        completed: false,
                        progress: 0
                    },
                    {
                        id: 'q4',
                        title: '领土扩张',
                        description: '占领5块领土',
                        target: { type: 'territory', amount: 5 },
                        reward: { luxury: 20, happiness: 10 },
                        completed: false,
                        progress: 0
                    }
                ];
            }

            updateProgress(game) {
                this.quests.forEach(quest => {
                    if (quest.completed) return;

                    if (quest.target.resource) {
                        quest.progress = Math.min(100, 
                            (game.resources.get(quest.target.resource) / quest.target.amount) * 100);
                        if (game.resources.get(quest.target.resource) >= quest.target.amount) {
                            this.completeQuest(quest, game);
                        }
                    } else if (quest.target.type === 'tech') {
                        let researched = 0;
                        for (let branch of Object.values(game.techTree.branches)) {
                            researched += branch.techs.filter(t => t.researched).length;
                        }
                        quest.progress = Math.min(100, (researched / quest.target.amount) * 100);
                        if (researched >= quest.target.amount) {
                            this.completeQuest(quest, game);
                        }
                    } else if (quest.target.type === 'territory') {
                        const territory = game.map.filter(c => c.owner === 'player').length;
                        quest.progress = Math.min(100, (territory / quest.target.amount) * 100);
                        if (territory >= quest.target.amount) {
                            this.completeQuest(quest, game);
                        }
                    }
                });
            }

            completeQuest(quest, game) {
                quest.completed = true;
                for (let [resource, amount] of Object.entries(quest.reward)) {
                    game.resources.add(resource, amount);
                }
                game.showToast('任务完成', `${quest.title} - 获得奖励！`);
                game.logEvent(`完成任务: ${quest.title}`, 'economy');
            }

            render() {
                const container = document.getElementById('questList');
                container.innerHTML = '';

                this.quests.forEach(quest => {
                    const questEl = document.createElement('div');
                    questEl.className = `quest-item ${quest.completed ? 'completed' : ''}`;
                    questEl.innerHTML = `
                        <div class="quest-title">
                            ${quest.completed ? '✅' : '📋'} ${quest.title}
                        </div>
                        <div class="quest-desc">${quest.description}</div>
                        <div class="quest-reward">奖励: ${Object.entries(quest.reward).map(([k, v]) => `${k}: ${v}`).join(', ')}</div>
                        <div class="quest-progress">
                            <div class="quest-progress-bar" style="width: ${quest.progress}%"></div>
                        </div>
                    `;
                    container.appendChild(questEl);
                });
            }
        }

        class Game {
            constructor() {
                this.turn = 1;
                this.resources = new ResourceManager();
                this.techTree = new TechTree();
                this.questSystem = new QuestSystem();
                this.tradeSystem = new TradeSystem();
                this.buildingSystem = new BuildingSystem();
                this.playerInventory = {};
                this.aiPlayers = [];
                this.map = [];
                this.mapSize = 12 * 12;
                this.visionRange = 2;
                this.selectedCell = null;
                
                this.initAIPlayers();
                this.initMap();
                this.renderMap();
                this.techTree.render();
                this.renderDiplomacy();
                this.questSystem.render();
                this.resources.updateDisplay();

                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    if (e.target.tagName === 'INPUT') return;
                    switch(e.key) {
                        case 'Enter': this.nextTurn(); break;
                        case 'e': case 'E': this.explore(); break;
                        case 'r': case 'R': this.recruit(); break;
                        case 't': case 'T': this.trade(); break;
                        case 'b': case 'B': this.build(); break;
                        case 'Escape': this.closeModal(); this.closeBattle(); break;
                    }
                });

                this.logEvent('游戏开始！建立你的帝国吧！', 'economy');
            }

            initAIPlayers() {
                const types = [
                    { type: 'expansion', name: '征服帝国', color: 'enemy-expansion' },
                    { type: 'trade', name: '商业联邦', color: 'enemy-trade' },
                    { type: 'tech', name: '智慧王国', color: 'enemy-tech' },
                    { type: 'defense', name: '坚盾公国', color: 'enemy-defense' },
                    { type: 'diplomacy', name: '和谐联盟', color: 'enemy-diplomacy' }
                ];

                types.forEach((t, i) => {
                    this.aiPlayers.push(new AIPlayer(i + 1, t.name, t.type, t.color));
                });
            }

            initMap() {
                for (let i = 0; i < this.mapSize; i++) {
                    this.map.push({
                        id: i,
                        owner: null,
                        explored: i < 24, // Starting area explored
                        type: 'neutral'
                    });
                }
                // Set player starting territory
                this.map[6].owner = 'player';
                this.map[7].owner = 'player';
                this.map[18].owner = 'player';
                this.map[19].owner = 'player';

                // Set AI territories - spread across the map
                const usedPositions = new Set([6, 7, 18, 19]); // Player positions
                this.aiPlayers.forEach((ai) => {
                    let pos;
                    let attempts = 0;
                    do {
                        pos = Math.floor(Math.random() * this.mapSize);
                        attempts++;
                    } while ((usedPositions.has(pos) || pos < 24) && attempts < 100);
                    if (attempts < 100) {
                        usedPositions.add(pos);
                        if (this.map[pos]) {
                            this.map[pos].owner = ai.id;
                            ai.territory = [pos];
                        }
                    }
                });
            }

            renderMap() {
                const container = document.getElementById('worldMap');
                container.innerHTML = '';

                this.map.forEach((cell, index) => {
                    const cellEl = document.createElement('div');
                    cellEl.className = 'map-cell';
                    
                    if (!cell.explored) {
                        cellEl.classList.add('fog');
                    } else {
                        cellEl.classList.add('explored');
                        if (cell.owner === 'player') {
                            cellEl.classList.add('player');
                            cellEl.textContent = '👑';
                        } else if (cell.owner) {
                            const ai = this.aiPlayers.find(a => a.id === cell.owner);
                            if (ai) {
                                cellEl.classList.add(ai.color);
                                cellEl.textContent = ai.name[0];
                            }
                        } else {
                            cellEl.classList.add('neutral');
                        }
                    }

                    cellEl.onclick = () => this.handleCellClick(index);
                    container.appendChild(cellEl);
                });
            }

            handleCellClick(index) {
                const cell = this.map[index];
                if (!cell.explored) {
                    this.showToast('无法操作', '该区域尚未探索');
                    return;
                }

                if (cell.owner === null) {
                    // Claim neutral territory
                    if (this.resources.canAfford({ gold: 100, military: 5 })) {
                        this.resources.pay({ gold: 100, military: 5 });
                        cell.owner = 'player';
                        this.renderMap();
                        this.logEvent('占领了新领土', 'diplomacy');
                        this.questSystem.updateProgress(this);
                        this.questSystem.render();
                    } else {
                        this.showToast('资源不足', '需要100金币和5军队');
                    }
                } else if (cell.owner !== 'player') {
                    // Attack AI
                    const ai = this.aiPlayers.find(a => a.id === cell.owner);
                    if (ai) {
                        this.initiateBattle(ai, index);
                    }
                }
            }

            switchTab(tabName, event) {
                document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
                if (event && event.currentTarget) {
                    event.currentTarget.classList.add('active');
                }
                document.getElementById(`tab-${tabName}`).classList.add('active');
                if (tabName === 'tech') this.techTree.render();
                if (tabName === 'diplomacy') this.renderDiplomacy();
                if (tabName === 'quests') this.questSystem.render();
            }

            researchTech(techId) {
                const tech = this.findTech(techId);
                if (!tech) return;

                if (this.resources.canAfford(tech.cost)) {
                    this.resources.pay(tech.cost);
                    this.techTree.research(techId);
                    this.techTree.render();
                    this.showToast('研究完成', `${tech.name} 已研究`);
                    this.logEvent(`研究了 ${tech.name}`, 'tech');
                    this.questSystem.updateProgress(this);
                    this.questSystem.render();
                } else {
                    this.showToast('资源不足', '无法研究此项科技');
                }
            }

            findTech(techId) {
                for (let branch of Object.values(this.techTree.branches)) {
                    const tech = branch.techs.find(t => t.id === techId);
                    if (tech) return tech;
                }
                return null;
            }

            renderDiplomacy() {
                const container = document.getElementById('nationList');
                container.innerHTML = '';

                this.aiPlayers.forEach(ai => {
                    const card = document.createElement('div');
                    card.className = 'nation-card';
                    card.innerHTML = `
                        <div class="nation-header">
                            <span class="nation-name">${ai.name}</span>
                            <span class="nation-type">${this.getTypeLabel(ai.type)}</span>
                        </div>
                        <div class="nation-stats">
                            <span>⚔️ ${ai.resources.military}</span>
                            <span>💰 ${ai.resources.gold}</span>
                            <span>🤝 ${ai.relations}%</span>
                        </div>
                        <div class="nation-actions">
                            <button class="btn-small gift" onclick="game.diplomaticAction(${ai.id}, 'gift')">送礼</button>
                            <button class="btn-small alliance" onclick="game.diplomaticAction(${ai.id}, 'alliance')">结盟</button>
                            <button class="btn-small threaten" onclick="game.diplomaticAction(${ai.id}, 'threaten')">威胁</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }

            getTypeLabel(type) {
                const labels = {
                    expansion: '扩张型',
                    trade: '贸易型',
                    tech: '科技型',
                    defense: '防御型',
                    diplomacy: '外交型'
                };
                return labels[type] || type;
            }

            diplomaticAction(aiId, action) {
                const ai = this.aiPlayers.find(a => a.id === aiId);
                if (!ai) return;

                switch(action) {
                    case 'gift':
                        if (this.resources.canAfford({ gold: 100, luxury: 5 })) {
                            this.resources.pay({ gold: 100, luxury: 5 });
                            ai.relations = Math.min(100, ai.relations + 15);
                            this.showToast('外交成功', `${ai.name} 对我们的好感度提升了`);
                            this.logEvent(`向 ${ai.name} 赠送礼物`, 'diplomacy');
                        } else {
                            this.showToast('资源不足', '需要100金币和5奢侈品');
                        }
                        break;
                    case 'alliance':
                        if (ai.relations >= 70) {
                            ai.alliance = true;
                            this.showToast('结盟成功', `与 ${ai.name} 建立了同盟`);
                            this.logEvent(`与 ${ai.name} 结盟`, 'diplomacy');
                        } else {
                            this.showToast('结盟失败', `与 ${ai.name} 的关系不够友好`);
                        }
                        break;
                    case 'threaten':
                        ai.relations = Math.max(0, ai.relations - 20);
                        this.showToast('外交行动', `威胁了 ${ai.name}`);
                        this.logEvent(`威胁 ${ai.name}`, 'diplomacy');
                        break;
                }
                this.renderDiplomacy();
            }

            initiateBattle(enemy, territoryIndex = null) {
                const playerPower = this.resources.get('military') * this.techTree.getBonus('military');
                const enemyPower = enemy.getPower();

                document.getElementById('attackerName').textContent = '我方军队';
                document.getElementById('attackerPower').textContent = Math.floor(playerPower);
                document.getElementById('defenderName').textContent = enemy.name;
                document.getElementById('defenderPower').textContent = Math.floor(enemyPower);
                
                document.getElementById('battleOverlay').classList.add('active');

                setTimeout(() => {
                    const playerRoll = Math.random() * playerPower;
                    const enemyRoll = Math.random() * enemyPower;
                    const victory = playerRoll > enemyRoll;

                    const resultEl = document.getElementById('battleResult');
                    if (victory) {
                        resultEl.textContent = '胜利！';
                        resultEl.className = 'battle-result victory';
                        
                        // Casualties
                        const casualties = Math.floor(this.resources.get('military') * 0.1);
                        this.resources.add('military', -casualties);
                        
                        if (territoryIndex !== null) {
                            this.map[territoryIndex].owner = 'player';
                            this.renderMap();
                        }
                        
                        this.logEvent(`战胜 ${enemy.name}！`, 'battle');
                    } else {
                        resultEl.textContent = '失败...';
                        resultEl.className = 'battle-result defeat';
                        
                        const casualties = Math.floor(this.resources.get('military') * 0.2);
                        this.resources.add('military', -casualties);
                        
                        this.logEvent(`败给 ${enemy.name}`, 'battle');
                    }
                }, 2000);
            }

            closeBattle() {
                document.getElementById('battleOverlay').classList.remove('active');
            }

            explore() {
                if (!this.resources.canAfford({ gold: 50 })) {
                    this.showToast('资源不足', '需要50金币');
                    return;
                }

                this.resources.pay({ gold: 50 });
                
                // Expand vision
                const explored = this.map.filter(c => c.explored).length;
                let newExplored = 0;
                
                for (let cell of this.map) {
                    if (!cell.explored && Math.random() < 0.3) {
                        cell.explored = true;
                        newExplored++;
                        if (newExplored >= 5) break;
                    }
                }

                this.renderMap();
                this.showToast('探索完成', `发现了 ${newExplored} 个新区域`);
                this.logEvent(`探索了周边区域`, 'diplomacy');
            }

            recruit() {
                if (!this.resources.canAfford({ gold: 80, food: 50, population: 8 })) {
                    this.showToast('资源不足', '需要80金币、50粮食和8人口');
                    return;
                }
                this.resources.pay({ gold: 80, food: 50, population: 8 });
                this.resources.add('military', 10);
                this.showToast('征兵完成', '军队增加了10人');
                this.logEvent('招募了新兵', 'battle');
            }

            trade() {
                this.openTradeModal();
            }

            openTradeModal() {
                const modalOverlay = document.getElementById('modalOverlay');
                const modalTitle = document.getElementById('modalTitle');
                const modalBody = document.getElementById('modalBody');
                const modalActions = document.querySelector('.modal-actions');

                let goodsHtml = '<div class="trade-goods-grid">';
                for (let [key, good] of Object.entries(this.tradeSystem.goods)) {
                    const trendIcon = good.trend > 0 ? '📈' : (good.trend < 0 ? '📉' : '➡️');
                    goodsHtml += `
                        <div class="trade-good-card" data-good="${key}">
                            <div class="good-icon">${good.icon}</div>
                            <div class="good-name">${good.name}</div>
                            <div class="good-price">${good.currentPrice} 💰</div>
                            <div class="good-trend">${trendIcon}</div>
                            <div class="good-stock">库存: ${good.stock}</div>
                            <div class="trade-actions">
                                <button onclick="game.tradeBuy('${key}', 1)">买1</button>
                                <button onclick="game.tradeBuy('${key}', 5)">买5</button>
                                <button onclick="game.tradeSell('${key}', 1)">卖1</button>
                            </div>
                        </div>
                    `;
                }
                goodsHtml += '</div>';

                modalTitle.textContent = '🏪 市场贸易';
                modalBody.innerHTML = `
                    <div class="market-info">
                        <span>市场趋势: ${this.tradeSystem.marketTrend > 1 ? '繁荣 📈' : '低迷 📉'}</span>
                        <span>贸易路线: ${this.tradeSystem.tradeRoutes.length} 条</span>
                    </div>
                    ${goodsHtml}
                    <div class="trade-inventory">
                        <h3>📦 我的库存</h3>
                        <div id="playerInventory"></div>
                    </div>
                `;

                // 隐藏标准按钮，使用自定义关闭按钮
                modalActions.innerHTML = '<button class="btn-small" onclick="game.closeModal()">关闭</button>';

                this.updateTradeInventory();
                modalOverlay.classList.add('active');
            }

            tradeBuy(goodKey, quantity) {
                const result = this.tradeSystem.buy(goodKey, quantity);
                if (!result) {
                    this.showToast('购买失败', '库存不足');
                    return;
                }
                if (!this.resources.canAfford({ gold: result.cost })) {
                    this.showToast('购买失败', '金币不足');
                    return;
                }
                this.resources.pay({ gold: result.cost });
                this.playerInventory[goodKey] = (this.playerInventory[goodKey] || 0) + quantity;
                this.showToast('购买成功', `购买了 ${quantity} ${TRADE_GOODS[goodKey].name}`);
                this.updateTradeInventory();
                this.openTradeModal(); // Refresh
            }

            tradeSell(goodKey, quantity) {
                if (!this.playerInventory[goodKey] || this.playerInventory[goodKey] < quantity) {
                    this.showToast('出售失败', '库存不足');
                    return;
                }
                const result = this.tradeSystem.sell(goodKey, quantity);
                this.resources.add('gold', result.revenue);
                this.playerInventory[goodKey] -= quantity;
                if (this.playerInventory[goodKey] === 0) delete this.playerInventory[goodKey];
                this.showToast('出售成功', `出售 ${quantity} ${TRADE_GOODS[goodKey].name} 获得 ${result.revenue} 金币`);
                this.updateTradeInventory();
                this.openTradeModal(); // Refresh
            }

            updateTradeInventory() {
                const container = document.getElementById('playerInventory');
                if (!container) return;
                let html = '';
                for (let [key, qty] of Object.entries(this.playerInventory)) {
                    const good = TRADE_GOODS[key];
                    if (good) {
                        html += `<span class="inventory-item">${good.icon} ${good.name}: ${qty}</span>`;
                    }
                }
                container.innerHTML = html || '<span class="empty">暂无库存</span>';
            }

            build() {
                this.openBuildModal();
            }

            openBuildModal() {
                const modalOverlay = document.getElementById('modalOverlay');
                const modalTitle = document.getElementById('modalTitle');
                const modalBody = document.getElementById('modalBody');
                const modalActions = document.querySelector('.modal-actions');

                let buildingsHtml = '<div class="buildings-grid">';
                for (let [key, building] of Object.entries(BUILDINGS)) {
                    const canAfford = this.resources.canAfford(building.cost);
                    const existing = this.buildingSystem.buildings.filter(b => b.type === key).length;

                    buildingsHtml += `
                        <div class="building-card ${canAfford ? '' : 'disabled'}" data-building="${key}">
                            <div class="building-icon">${building.icon}</div>
                            <div class="building-name">${building.name}</div>
                            <div class="building-cost">
                                ${Object.entries(building.cost).map(([k, v]) => `${RESOURCE_NAMES[k] || k}: ${v}`).join(', ')}
                            </div>
                            <div class="building-effect">
                                ${building.output ? Object.entries(building.output).map(([k, v]) => `+${v} ${RESOURCE_NAMES[k] || k}/回合`).join(', ') : ''}
                                ${building.effect ? `效果: ${EFFECT_NAMES[building.effect] || building.effect}` : ''}
                            </div>
                            <div class="building-maintenance">
                                维护: ${Object.entries(building.maintenance).map(([k, v]) => `${v} ${RESOURCE_NAMES[k] || k}/回合`).join(', ')}
                            </div>
                            <div class="building-count">已建造: ${existing}</div>
                            <button ${canAfford ? '' : 'disabled'} onclick="game.constructBuilding('${key}')">
                                建造
                            </button>
                        </div>
                    `;
                }
                buildingsHtml += '</div>';

                const maintenance = this.buildingSystem.getMaintenanceCost();
                const output = this.buildingSystem.getOutput();

                modalTitle.textContent = '🏗️ 建造建筑';
                const outputText = Object.keys(output).length > 0 
                    ? Object.entries(output).map(([k, v]) => `+${v} ${RESOURCE_NAMES[k] || k}`).join(', ') 
                    : '暂无产出';
                const maintenanceText = Object.keys(maintenance).length > 0 
                    ? Object.entries(maintenance).map(([k, v]) => `${v} ${RESOURCE_NAMES[k] || k}`).join(', ') 
                    : '暂无';
                modalBody.innerHTML = `
                    <div class="building-summary">
                        <div>维护费用: ${maintenanceText} /回合</div>
                        <div>建筑产出: ${outputText} /回合</div>
                    </div>
                    ${buildingsHtml}
                    <div class="existing-buildings">
                        <h3>已建造建筑</h3>
                        <div id="existingBuildingsList"></div>
                    </div>
                `;

                // 隐藏标准按钮，使用自定义关闭按钮
                modalActions.innerHTML = '<button class="btn-small" onclick="game.closeModal()">关闭</button>';

                this.updateExistingBuildingsList();
                modalOverlay.classList.add('active');
            }

            constructBuilding(type) {
                const building = BUILDINGS[type];
                if (!building) return;

                if (!this.resources.canAfford(building.cost)) {
                    this.showToast('建造失败', '资源不足');
                    return;
                }

                this.resources.pay(building.cost);
                this.buildingSystem.addBuilding(type);
                this.showToast('建造成功', `${building.name} 建造完成`);
                this.logEvent(`建造了 ${building.name}`, 'economy');
                this.openBuildModal(); // Refresh
            }

            updateExistingBuildingsList() {
                const container = document.getElementById('existingBuildingsList');
                if (!container) return;

                if (this.buildingSystem.buildings.length === 0) {
                    container.innerHTML = '<span class="empty">暂无建筑</span>';
                    return;
                }

                let html = '';
                this.buildingSystem.buildings.forEach((b, index) => {
                    const canUpgrade = b.level < b.maxLevel && this.resources.canAfford(b.upgradeCost);
                    html += `
                        <div class="existing-building">
                            <span>${b.icon} ${b.name} Lv.${b.level}</span>
                            ${canUpgrade ? `<button onclick="game.upgradeBuilding(${index})">升级</button>` : ''}
                        </div>
                    `;
                });
                container.innerHTML = html;
            }

            upgradeBuilding(index) {
                const building = this.buildingSystem.buildings[index];
                if (!building) return;

                if (!this.resources.canAfford(building.upgradeCost)) {
                    this.showToast('升级失败', '资源不足');
                    return;
                }

                this.resources.pay(building.upgradeCost);
                this.buildingSystem.upgradeBuilding(index);
                this.showToast('升级成功', `${building.name} 升级到 Lv.${building.level}`);
                this.openBuildModal(); // Refresh
            }

            nextTurn() {
                this.turn++;
                document.getElementById('turnCount').textContent = this.turn;

                // Apply resource changes
                this.resources.applyTurnChanges();

                // AI turns
                this.aiPlayers.forEach(ai => {
                    const oldGold = ai.resources.gold;
                    const oldMilitary = ai.resources.military;
                    ai.takeTurn();
                    // Expand AI territory occasionally
                    if (Math.random() < 0.2) {
                        const neutral = this.map.filter(c => !c.owner);
                        if (neutral.length > 0) {
                            const target = neutral[Math.floor(Math.random() * neutral.length)];
                            target.owner = ai.id;
                            ai.territory.push(target.id);
                            this.logEvent(`${ai.name} 扩张了领土`, 'battle');
                        }
                    }
                    // Log significant AI actions
                    if (ai.resources.military > oldMilitary + 5) {
                        this.logEvent(`${ai.name} 增强了军备`, 'battle');
                    }
                });

                // Update trade prices
                this.tradeSystem.updatePrices();
                // Generate revenue from trade routes
                this.tradeSystem.tradeRoutes.forEach(route => {
                    const good = this.tradeSystem.goods[route.good];
                    if (good) {
                        const revenue = Math.floor(good.currentPrice * route.quantity * 0.1);
                        this.resources.add('gold', revenue);
                        route.revenue += revenue;
                    }
                });

                this.renderMap();
                this.questSystem.updateProgress(this);
                this.questSystem.render();

                this.logEvent(`第 ${this.turn} 回合开始`, 'economy');
                this.showToast('新回合', `第 ${this.turn} 回合开始`);
            }

            logEvent(message, type = 'economy') {
                const log = document.getElementById('eventLog');
                const entry = document.createElement('div');
                entry.className = `log-entry ${type}`;
                entry.innerHTML = `
                    <div class="log-time">回合 ${this.turn}</div>
                    <div>${message}</div>
                `;
                log.insertBefore(entry, log.firstChild);

                // Keep only last 20 entries
                while (log.children.length > 20) {
                    log.removeChild(log.lastChild);
                }
            }

            showToast(title, message) {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.innerHTML = `
                    <div class="toast-title">${title}</div>
                    <div class="toast-message">${message}</div>
                `;
                container.appendChild(toast);

                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(100px)';
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }

            saveGame() {
                const saveData = {
                    resources: this.resources.resources,
                    turn: this.turn,
                    map: this.map.map(c => ({...c})),
                    aiPlayers: this.aiPlayers.map(ai => ({...ai, resources: {...ai.resources}})),
                    techTree: JSON.parse(JSON.stringify(this.techTree.branches)),
                    quests: this.questSystem.quests
                };
                localStorage.setItem('empire_save', JSON.stringify(saveData));
                this.showToast('存档成功', '游戏已保存');
                this.logEvent('保存了游戏进度', 'economy');
            }

            loadGame() {
                const data = localStorage.getItem('empire_save');
                if (!data) {
                    this.showToast('读取失败', '没有找到存档');
                    return;
                }
                try {
                    const save = JSON.parse(data);
                    this.resources.resources = save.resources;
                    this.turn = save.turn;
                    save.map.forEach((c, i) => Object.assign(this.map[i], c));
                    save.aiPlayers.forEach((saved, i) => {
                        if (this.aiPlayers[i]) {
                            Object.assign(this.aiPlayers[i], saved);
                        }
                    });
                    Object.assign(this.techTree.branches, save.techTree);
                    this.questSystem.quests = save.quests;
                    document.getElementById('turnCount').textContent = this.turn;
                    this.resources.updateDisplay();
                    this.renderMap();
                    this.showToast('读取成功', '存档已加载');
                    this.logEvent('加载了游戏进度', 'economy');
                } catch(e) {
                    this.showToast('读取失败', '存档数据损坏');
                }
            }

            showModal(title, body, onConfirm) {
                document.getElementById('modalTitle').textContent = title;
                document.getElementById('modalBody').innerHTML = body;
                document.getElementById('modalOverlay').classList.add('active');
                
                const confirmBtn = document.getElementById('modalConfirm');
                confirmBtn.onclick = () => {
                    this.closeModal();
                    if (onConfirm) onConfirm();
                };
            }

            closeModal() {
                document.getElementById('modalOverlay').classList.remove('active');
            }
        }

        // Initialize game
        const game = new Game();
    </script>
</body>
</html>
