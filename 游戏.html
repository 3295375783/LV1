<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帝国疆域 - 国家领土模拟器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a25;
            --glass-bg: rgba(20, 20, 35, 0.7);
            --glass-border: rgba(100, 100, 150, 0.2);
            --glass-highlight: rgba(255, 255, 255, 0.05);
            --accent-gold: #d4af37;
            --accent-gold-glow: rgba(212, 175, 55, 0.4);
            --accent-red: #c73e3e;
            --accent-green: #4a9b4a;
            --accent-blue: #4a7cb8;
            --accent-purple: #8b5a9f;
            --text-primary: #e8e8f0;
            --text-secondary: #a0a0b0;
            --text-muted: #606070;
            --font-display: 'Cinzel', serif;
            --font-body: 'Noto Serif SC', serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(ellipse at 20% 80%, rgba(139, 90, 159, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(74, 124, 184, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(212, 175, 55, 0.05) 0%, transparent 70%),
                var(--bg-primary);
        }

        .bg-animation::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(100, 100, 150, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(100, 100, 150, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* Glass Card Base */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 var(--glass-highlight);
        }

        /* Header */
        .game-header {
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
        }

        .game-title {
            font-family: var(--font-display);
            font-size: 1.8rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--accent-gold) 0%, #f0d878 50%, var(--accent-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px var(--accent-gold-glow);
            letter-spacing: 2px;
        }

        .turn-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .turn-counter {
            font-family: var(--font-display);
            font-size: 1.2rem;
            color: var(--accent-gold);
        }

        .btn-primary {
            padding: 12px 28px;
            background: linear-gradient(135deg, var(--accent-gold) 0%, #b8941f 100%);
            border: none;
            border-radius: 8px;
            color: var(--bg-primary);
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* Main Layout */
        .game-container {
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            gap: 20px;
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Resource Panel */
        .resource-panel {
            padding: 20px;
        }

        .panel-title {
            font-family: var(--font-display);
            font-size: 1rem;
            color: var(--accent-gold);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .resource-grid {
            display: grid;
            gap: 10px;
        }

        .resource-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .resource-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .resource-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .resource-icon.gold { background: linear-gradient(135deg, #d4af37, #b8941f); }
        .resource-icon.food { background: linear-gradient(135deg, #4a9b4a, #3a7a3a); }
        .resource-icon.wood { background: linear-gradient(135deg, #8b6f47, #6b5537); }
        .resource-icon.iron { background: linear-gradient(135deg, #6b7c8b, #4b5c6b); }
        .resource-icon.luxury { background: linear-gradient(135deg, #9b6b9b, #7b4b7b); }
        .resource-icon.population { background: linear-gradient(135deg, #4a8b9b, #3a6b7a); }
        .resource-icon.military { background: linear-gradient(135deg, #c73e3e, #a72e2e); }
        .resource-icon.happiness { background: linear-gradient(135deg, #f0a050, #d08030); }

        .resource-info {
            flex: 1;
        }

        .resource-name {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 2px;
        }

        .resource-value {
            font-family: var(--font-display);
            font-size: 1.1rem;
            font-weight: 600;
        }

        .resource-change {
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(74, 155, 74, 0.2);
            color: var(--accent-green);
        }

        .resource-change.negative {
            background: rgba(199, 62, 62, 0.2);
            color: var(--accent-red);
        }

        /* Center Panel - Map & Main Content */
        .center-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Tab Navigation */
        .tab-nav {
            display: flex;
            gap: 8px;
            padding: 5px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
        }

        .tab-btn {
            padding: 10px 20px;
            background: transparent;
            border: none;
            border-radius: 8px;
            color: var(--text-secondary);
            font-family: var(--font-body);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-btn.active {
            color: var(--accent-gold);
            background: rgba(212, 175, 55, 0.15);
        }

        /* Tab Content */
        .tab-content {
            display: none;
            flex: 1;
        }

        .tab-content.active {
            display: block;
        }

        /* Map Section */
        .map-container {
            padding: 20px;
            min-height: 400px;
        }

        .world-map {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 4px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
        }

        .map-cell {
            aspect-ratio: 1;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
        }

        .map-cell:hover {
            transform: scale(1.1);
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .map-cell.player {
            background: linear-gradient(135deg, var(--accent-gold), #b8941f);
            box-shadow: 0 0 15px var(--accent-gold-glow);
        }

        .map-cell.enemy-expansion {
            background: linear-gradient(135deg, var(--accent-red), #a72e2e);
        }

        .map-cell.enemy-trade {
            background: linear-gradient(135deg, var(--accent-green), #3a7a3a);
        }

        .map-cell.enemy-tech {
            background: linear-gradient(135deg, var(--accent-blue), #3a5c98);
        }

        .map-cell.enemy-defense {
            background: linear-gradient(135deg, #6b6b6b, #4b4b4b);
        }

        .map-cell.enemy-diplomacy {
            background: linear-gradient(135deg, var(--accent-purple), #6b3a7f);
        }

        .map-cell.neutral {
            background: rgba(100, 100, 120, 0.3);
        }

        .map-cell.fog {
            background: rgba(50, 50, 60, 0.5);
        }

        .map-cell.explored {
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        /* Tech Tree */
        .tech-tree {
            padding: 20px;
        }

        .tech-branches {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .tech-branch {
            padding: 15px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .branch-title {
            font-family: var(--font-display);
            font-size: 0.9rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .branch-title.military { color: var(--accent-red); }
        .branch-title.economic { color: var(--accent-gold); }
        .branch-title.agriculture { color: var(--accent-green); }
        .branch-title.industrial { color: var(--accent-blue); }

        .tech-node {
            padding: 12px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .tech-node:hover:not(.locked):not(.researched) {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .tech-node.researched {
            background: rgba(74, 155, 74, 0.15);
            border-color: rgba(74, 155, 74, 0.3);
        }

        .tech-node.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .tech-node.available {
            border-color: var(--accent-gold);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .tech-name {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .tech-cost {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Diplomacy Panel */
        .diplomacy-panel {
            padding: 20px;
        }

        .nation-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nation-card {
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nation-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .nation-name {
            font-family: var(--font-display);
            font-size: 1rem;
        }

        .nation-type {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
        }

        .nation-stats {
            display: flex;
            gap: 15px;
            margin-bottom: 12px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .nation-actions {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-small:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .btn-small.gift { color: var(--accent-green); border-color: rgba(74, 155, 74, 0.3); }
        .btn-small.alliance { color: var(--accent-blue); border-color: rgba(74, 124, 184, 0.3); }
        .btn-small.threaten { color: var(--accent-red); border-color: rgba(199, 62, 62, 0.3); }

        /* Quest Panel */
        .quest-panel {
            padding: 20px;
        }

        .quest-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .quest-item {
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .quest-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .quest-item.completed {
            opacity: 0.6;
            border-color: rgba(74, 155, 74, 0.3);
        }

        .quest-title {
            font-weight: 600;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quest-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .quest-reward {
            font-size: 0.8rem;
            color: var(--accent-gold);
        }

        .quest-progress {
            margin-top: 8px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .quest-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-gold), #f0d878);
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        /* Right Panel - Actions & Log */
        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .actions-panel {
            padding: 20px;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .action-btn {
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .action-btn .icon {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .action-btn .label {
            font-size: 0.8rem;
        }

        /* Event Log */
        .event-log {
            padding: 20px;
            flex: 1;
            max-height: 400px;
            overflow-y: auto;
        }

        .event-log::-webkit-scrollbar {
            width: 6px;
        }

        .event-log::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 3px;
        }

        .event-log::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .log-entry {
            padding: 10px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            border-left: 3px solid var(--accent-gold);
            font-size: 0.85rem;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .log-entry.battle { border-left-color: var(--accent-red); }
        .log-entry.diplomacy { border-left-color: var(--accent-blue); }
        .log-entry.economy { border-left-color: var(--accent-green); }
        .log-entry.tech { border-left-color: var(--accent-purple); }

        .log-time {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 3px;
        }

        /* Battle Animation Overlay */
        .battle-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .battle-overlay.active {
            display: flex;
        }

        .battle-scene {
            width: 600px;
            padding: 40px;
            text-align: center;
        }

        .battle-title {
            font-family: var(--font-display);
            font-size: 2rem;
            color: var(--accent-red);
            margin-bottom: 30px;
            text-shadow: 0 0 30px rgba(199, 62, 62, 0.5);
        }

        .battle-forces {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
        }

        .force-side {
            padding: 20px 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
        }

        .force-name {
            font-family: var(--font-display);
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .force-power {
            font-size: 1.5rem;
            color: var(--accent-gold);
        }

        .battle-vs {
            font-family: var(--font-display);
            font-size: 1.5rem;
            color: var(--text-muted);
            align-self: center;
        }

        .battle-animation {
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .battle-sword {
            font-size: 3rem;
            animation: clash 0.5s ease-in-out infinite alternate;
        }

        @keyframes clash {
            0% { transform: rotate(-20deg); }
            100% { transform: rotate(20deg); }
        }

        .battle-result {
            font-size: 1.3rem;
            margin-bottom: 20px;
        }

        .battle-result.victory { color: var(--accent-green); }
        .battle-result.defeat { color: var(--accent-red); }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1001;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            width: 500px;
            max-width: 90%;
            padding: 30px;
        }

        .modal-title {
            font-family: var(--font-display);
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--accent-gold);
        }

        .modal-body {
            margin-bottom: 20px;
            line-height: 1.6;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 10px;
        }

        .modal-body::-webkit-scrollbar {
            width: 6px;
        }

        .modal-body::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .modal-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }

        .modal-body::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .game-container {
                grid-template-columns: 1fr;
            }
            
            .resource-panel,
            .right-panel {
                order: 2;
            }
            
            .center-panel {
                order: 1;
            }
        }

        /* Notification Toast */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1002;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            padding: 15px 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: toastIn 0.3s ease;
            max-width: 300px;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .toast-title {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .toast-message {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* Exploration Overlay */
        .exploration-effect {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.3) 0%, transparent 70%);
            pointer-events: none;
            animation: explorePulse 1s ease-out forwards;
        }

        @keyframes explorePulse {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            100% {
                transform: scale(3);
                opacity: 0;
            }
        }

        /* Tooltip */
        .tooltip {
            position: absolute;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            font-size: 0.8rem;
            pointer-events: none;
            z-index: 100;
            max-width: 200px;
        }

        /* Trade System Styles */
        .trade-goods-grid {
            display: grid;
